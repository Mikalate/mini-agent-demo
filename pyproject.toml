[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent"
version = "0.1.0"
description = "A minimal agent implemented with an explicit Python control loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai==1.108.1",
    "jsonschema==4.26.0",
    "rich==14.3.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
mini-agent = "mini_agent.cli:main"

[tool.setuptools.packages.find]
include = ["mini_agent*", "data*"]

[tool.setuptools.package-data]
"mini_agent.sessions" = ["schema.sql"]
"data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: requires a real DeepSeek API key and network access"]
